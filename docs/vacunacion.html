<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vacunación · MiHato</title>
    <meta name="description" content="Calendario y registro de vacunación del hato." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        if (localStorage.getItem("mihato:theme") === "dark") document.documentElement.classList.add("dark");
      } catch {
        /* localStorage no disponible */
      }
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%234b6b3a'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="./assets/vacunacion-DgwVY5uV.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/utils-CvC1LC_K.js">
    <link rel="modulepreload" crossorigin href="./assets/layout-CZHZwXwL.js">
    <link rel="modulepreload" crossorigin href="./assets/badges-BpIjWwjw.js">
    <link rel="modulepreload" crossorigin href="./assets/modal-DtY6PnMf.js">
    <link rel="modulepreload" crossorigin href="./assets/toast-Dsopc036.js">
    <link rel="modulepreload" crossorigin href="./assets/vaccineForm-JDAaR8gl.js">
    <link rel="stylesheet" crossorigin href="./assets/utils-BxwgMFup.css">
  </head>
  <body class="font-body">
    <div id="sidebar-root"></div>
    <div class="lg:pl-64 flex flex-col min-h-dvh">
      <div id="topbar-root"></div>
      <main id="main-content" class="flex-1 px-4 sm:px-6 py-6 pb-24 lg:pb-10 outline-none">
        <section aria-label="Resumen de vacunación" class="grid grid-cols-3 gap-3 sm:gap-4">
          <div class="rounded-card bg-danger-soft p-4 sm:p-5">
            <p class="text-xs font-medium text-danger">Vencidas</p>
            <p id="stat-vencidas" class="mt-1 font-display text-2xl sm:text-3xl font-semibold text-danger tabular">—</p>
          </div>
          <div class="rounded-card bg-warning-soft p-4 sm:p-5">
            <p class="text-xs font-medium text-warning">Próximas</p>
            <p id="stat-proximas" class="mt-1 font-display text-2xl sm:text-3xl font-semibold text-warning tabular">—</p>
          </div>
          <div class="rounded-card bg-success-soft p-4 sm:p-5">
            <p class="text-xs font-medium text-success">Al día</p>
            <p id="stat-aldia" class="mt-1 font-display text-2xl sm:text-3xl font-semibold text-success tabular">—</p>
          </div>
        </section>

        <section aria-labelledby="pendientes-heading" class="mt-6 rounded-card bg-surface border border-border shadow-soft">
          <div class="px-5 py-4 border-b border-border">
            <h2 id="pendientes-heading" class="font-display font-semibold text-text">Pendientes de Fiebre Aftosa</h2>
            <p class="text-sm text-text-muted mt-0.5">Vacuna semestral de control obligatorio ICA</p>
          </div>
          <div id="pendientes-list" class="divide-y divide-border"></div>
        </section>

        <section aria-labelledby="historial-heading" class="mt-6 rounded-card bg-surface border border-border shadow-soft">
          <div class="px-5 py-4 border-b border-border">
            <h2 id="historial-heading" class="font-display font-semibold text-text">Historial de aplicaciones</h2>
          </div>
          <div class="overflow-x-auto scrollbar-thin">
            <table class="w-full text-sm min-w-[700px]">
              <thead>
                <tr class="border-b border-border text-left text-xs font-medium text-text-muted">
                  <th scope="col" class="px-5 py-3">Animal</th>
                  <th scope="col" class="px-5 py-3">Vacuna</th>
                  <th scope="col" class="px-5 py-3">Fecha</th>
                  <th scope="col" class="px-5 py-3">Próxima dosis</th>
                  <th scope="col" class="px-5 py-3">Veterinario(a)</th>
                </tr>
              </thead>
              <tbody id="historial-tbody" class="divide-y divide-border"></tbody>
            </table>
          </div>
          <div id="historial-empty" class="hidden px-6 py-10 text-center text-sm text-text-muted"></div>
        </section>
      </main>
    </div>
    <div id="bottomnav-root"></div>
    <button
      id="fab-add"
      type="button"
      class="lg:hidden fixed bottom-20 right-4 z-30 grid place-items-center size-14 rounded-full bg-primary text-white shadow-lifted focus-ring no-print"
      aria-label="Registrar vacuna"
    ></button>
  </body>
</html>
