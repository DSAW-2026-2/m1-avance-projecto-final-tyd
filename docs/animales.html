<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Animales · MiHato</title>
    <meta name="description" content="Listado y gestión de los animales del hato." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        if (localStorage.getItem("mihato:theme") === "dark") document.documentElement.classList.add("dark");
      } catch {
        /* localStorage no disponible */
      }
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%234b6b3a'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="./assets/animales-D8_bwITW.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/utils-CvC1LC_K.js">
    <link rel="modulepreload" crossorigin href="./assets/layout-CZHZwXwL.js">
    <link rel="modulepreload" crossorigin href="./assets/badges-BpIjWwjw.js">
    <link rel="modulepreload" crossorigin href="./assets/modal-DtY6PnMf.js">
    <link rel="modulepreload" crossorigin href="./assets/confirm-zDJAw5Fj.js">
    <link rel="modulepreload" crossorigin href="./assets/toast-Dsopc036.js">
    <link rel="modulepreload" crossorigin href="./assets/animalForm-CKNeEgJb.js">
    <link rel="stylesheet" crossorigin href="./assets/utils-BxwgMFup.css">
  </head>
  <body class="font-body">
    <div id="sidebar-root"></div>
    <div class="lg:pl-64 flex flex-col min-h-dvh">
      <div id="topbar-root"></div>
      <main id="main-content" class="flex-1 px-4 sm:px-6 py-6 pb-24 lg:pb-10 outline-none">
        <div class="flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-4">
          <div class="relative flex-1">
            <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-text-muted" aria-hidden="true"></span>
            <label for="search-input" class="sr-only">Buscar animal por arete o nombre</label>
            <input
              id="search-input"
              type="search"
              placeholder="Buscar por arete o nombre…"
              class="focus-ring w-full rounded-control border border-border bg-surface pl-4 pr-4 py-2.5 text-sm text-text placeholder:text-text-muted"
            />
          </div>
          <div class="flex gap-2">
            <label class="sr-only" for="filter-categoria">Filtrar por categoría</label>
            <select id="filter-categoria" class="focus-ring rounded-control border border-border bg-surface px-3 py-2.5 text-sm text-text">
              <option value="">Categoría</option>
            </select>
            <label class="sr-only" for="filter-estado">Filtrar por estado</label>
            <select id="filter-estado" class="focus-ring rounded-control border border-border bg-surface px-3 py-2.5 text-sm text-text">
              <option value="">Estado</option>
            </select>
          </div>
        </div>

        <p id="results-count" class="mt-3 text-sm text-text-muted" role="status" aria-live="polite"></p>

        <div class="mt-2 rounded-card border border-border bg-surface shadow-soft overflow-x-auto scrollbar-thin">
          <table class="w-full text-sm min-w-[880px]">
            <thead>
              <tr class="border-b border-border text-left text-xs font-medium text-text-muted">
                <th scope="col" class="px-4 py-3">Arete</th>
                <th scope="col" class="px-4 py-3">Nombre</th>
                <th scope="col" class="px-4 py-3">Categoría</th>
                <th scope="col" class="px-4 py-3">Edad</th>
                <th scope="col" class="px-4 py-3">Peso</th>
                <th scope="col" class="px-4 py-3">Potrero</th>
                <th scope="col" class="px-4 py-3">Vacunación</th>
                <th scope="col" class="px-4 py-3"><span class="sr-only">Acciones</span></th>
              </tr>
            </thead>
            <tbody id="animales-tbody" class="divide-y divide-border"></tbody>
          </table>
          <div id="empty-state" class="hidden px-6 py-14 text-center"></div>
        </div>
      </main>
    </div>
    <div id="bottomnav-root"></div>
    <button
      id="fab-add"
      type="button"
      class="lg:hidden fixed bottom-20 right-4 z-30 grid place-items-center size-14 rounded-full bg-primary text-white shadow-lifted focus-ring no-print"
      aria-label="Agregar animal"
    ></button>
  </body>
</html>
